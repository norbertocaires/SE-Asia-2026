<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>SE Asia 2026 — Trip Plan</title>
<style>
  :root {
    --bg: #fff; --fg: #1f2328; --muted: #59636e; --border: #d1d9e0;
    --link: #0969da; --code-bg: #f6f8fa; --row-alt: #f6f8fa;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1117; --fg: #e6edf3; --muted: #9198a1; --border: #3d444d;
      --link: #4493f8; --code-bg: #161b22; --row-alt: #161b22;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  main { max-width: 900px; margin: 0 auto; padding: 32px 20px 96px; }
  h1, h2, h3, h4 { line-height: 1.25; margin: 1.6em 0 0.6em; }
  h1 { font-size: 2em; padding-bottom: .3em; border-bottom: 1px solid var(--border); }
  h2 { font-size: 1.5em; padding-bottom: .3em; border-bottom: 1px solid var(--border); }
  h3 { font-size: 1.2em; }
  a { color: var(--link); text-decoration: none; }
  a:hover { text-decoration: underline; }
  p, ul, ol, blockquote, table { margin: 0 0 1em; }
  blockquote { margin-left: 0; padding: 0 1em; color: var(--muted); border-left: 3px solid var(--border); }
  code { background: var(--code-bg); padding: .2em .4em; border-radius: 6px; font-size: .9em;
    font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
  pre { background: var(--code-bg); padding: 16px; border-radius: 6px; overflow-x: auto; }
  pre code { background: none; padding: 0; }
  hr { border: 0; border-top: 1px solid var(--border); margin: 2em 0; }
  .table-wrap { overflow-x: auto; margin: 0 0 1em; }
  table { border-collapse: collapse; width: 100%; }
  th, td { border: 1px solid var(--border); padding: 6px 13px; text-align: left; }
  tr:nth-child(2n) td { background: var(--row-alt); }
  img { max-width: 100%; }
</style>
</head>
<body>
<main id="content">Loading…</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script>
  // Vercel refuses to serve a file named README.md, so the build step copies
  // it to doc.md. When opened locally, fall back to the real README.md.
  var SOURCES = ["doc.md", "README.md"];

  (function load(i) {
    fetch(SOURCES[i])
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); })
      .then(render)
      .catch(function () {
        if (i + 1 < SOURCES.length) load(i + 1);
        else document.getElementById("content").textContent = "Failed to load README.md";
      });
  })(0);

  function render(md) {
      marked.setOptions({ gfm: true });
      document.getElementById("content").innerHTML = marked.parse(md);
      document.querySelectorAll("table").forEach(function (t) {
        var w = document.createElement("div");
        w.className = "table-wrap";
        t.parentNode.insertBefore(w, t);
        w.appendChild(t);
      });
  }
</script>
</body>
</html>
